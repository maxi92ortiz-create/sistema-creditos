<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Sistema de créditos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #edf2f6;
      color: #18324b;
      font: 16px system-ui, Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 40px #17324d15;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #526778;
      line-height: 1.6;
    }

    a {
      display: block;
      margin-top: 24px;
      padding: 16px;
      background: #17324d;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    a:hover {
      background: #285270;
    }

    a:focus-visible {
      outline: 3px solid #147e77;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Sistema de créditos</h1>

    <p>
      Presioná Ingresar para abrir la aplicación.
      Luego escribí tu usuario y contraseña.
    </p>

    <a href="https://script.google.com/macros/s/AKfycbzcgnWixCsk28smLH5KKaoA8RDnJkz-fMnWn5D3RF8oSlMpL6evgx5amwNRQWp-oeFZ/exec">
      Ingresar
    </a>
  </main>
</body>
</html>
