<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Ingreso al sistema de créditos y cobranzas.">
  <meta name="referrer" content="no-referrer">

  <title>Créditos | Ingreso</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #edf2f6;
      color: #18324b;
      font: 16px/1.6 system-ui, -apple-system,
            BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 490px;
      background: white;
      border: 1px solid #dce5ec;
      border-radius: 22px;
      padding: 40px;
      box-shadow: 0 20px 70px #17324d0d;
    }

    .marca {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      background: #18324b;
      color: white;
      border-radius: 15px;
      font-size: 25px;
      font-weight: 700;
    }

    .etiqueta {
      margin: 28px 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #64798a;
    }

    h1 {
      font-size: 34px;
      line-height: 1.2;
      margin: 0 0 16px;
      letter-spacing: -.03em;
    }

    p {
      color: #526778;
      margin: 0 0 22px;
    }

    .boton {
      display: block;
      text-align: center;
      padding: 15px 20px;
      border-radius: 11px;
      background: #18324b;
      color: white;
      text-decoration: none;
      font-weight: 650;
    }

    .boton:hover {
      background: #264b68;
    }

    .boton:focus-visible {
      outline: 3px solid #359e9a;
      outline-offset: 5px;
    }

    .nota {
      margin-top: 24px;
      margin-bottom: 0;
      font-size: 13px;
      border-top: 1px solid #e4ebf0;
      padding-top: 20px;
    }

    @media (max-width: 420px) {
      main {
        padding: 28px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="marca" aria-hidden="true">C</div>

    <p class="etiqueta">Sistema de créditos</p>

    <h1>Acceso al sistema</h1>

    <p>
      Ingresá con tu usuario y contraseña para consultar
      la información habilitada para tu cuenta.
    </p>

    <a
      class="boton"
      href="https://script.google.com/macros/s/AKfycbywyz9U8k7ESWbGFQPUJpDltcN_4KKQWHtBD1OixHHwsJIpMhtLAwDvQoMRH29r7oQu/exec"
      rel="noreferrer"
    >
      Ingresar
    </a>

    <p class="nota">
      El botón abre la aplicación en Google Apps Script.
      Usá las credenciales generadas durante la instalación.
    </p>
  </main>
</body>
</html>
